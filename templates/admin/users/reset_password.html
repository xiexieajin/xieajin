{% extends "base.html" %}
{% block title %}重置密码 - 供应商寻源系统{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="page-title mb-0"><i class="bi bi-key"></i> 重置密码</h1>
    <a href="{{ url_for('admin_user_list') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> 返回用户列表
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body">
                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i>
                    正在为用户 <strong>{{ user.display_name }}</strong>（{{ user.username }}）重置密码
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">新密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" name="password" required
                               placeholder="至少4位" minlength="4">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check-lg"></i> 确认重置
                        </button>
                        <a href="{{ url_for('admin_user_list') }}" class="btn btn-outline-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
