{% extends "base.html" %}
{% block title %}{{ '编辑用户' if user else '新增用户' }} - 供应商寻源系统{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="page-title mb-0">
        <i class="bi bi-{{ 'pencil' if user else 'person-plus' }}"></i>
        {{ '编辑用户' if user else '新增用户' }}
    </h1>
    <a href="{{ url_for('admin_user_list') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> 返回用户列表
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">用户名 <span class="text-danger">*</span></label>
                        {% if user %}
                        <input type="text" class="form-control" value="{{ user.username }}" disabled>
                        <small class="text-muted">用户名创建后不可修改</small>
                        {% else %}
                        <input type="text" class="form-control" name="username" required
                               placeholder="用于登录，如 zhangsan">
                        {% endif %}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">显示名 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="display_name" required
                               value="{{ user.display_name if user else '' }}"
                               placeholder="页面上显示的名称，如 张三">
                    </div>
                    {% if not user %}
                    <div class="mb-3">
                        <label class="form-label">密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" name="password" required
                               placeholder="至少4位">
                    </div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label">角色 <span class="text-danger">*</span></label>
                        <select class="form-select" name="role">
                            <option value="user" {{ 'selected' if user and user.role == 'user' }}>普通用户</option>
                            <option value="admin" {{ 'selected' if user and user.role == 'admin' }}>管理员</option>
                        </select>
                        <small class="text-muted">管理员可管理所有用户和配置，普通用户只能管理自己的数据</small>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> 保存
                        </button>
                        <a href="{{ url_for('admin_user_list') }}" class="btn btn-outline-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
