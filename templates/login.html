<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 供应商寻源系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.0.18/index.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; background: #f5f7fa; }
        .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: none; border-radius: 12px; }
        .login-brand { text-align: center; margin-bottom: 1.5rem; }
        .login-brand i { font-size: 2.5rem; color: #0d6efd; }
        .login-brand h4 { margin-top: 0.5rem; font-weight: 600; color: #2c3e50; }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="card login-card">
        <div class="card-body p-4">
            <div class="login-brand">
                <i class="bi bi-diagram-3"></i>
                <h4>供应商寻源系统</h4>
                <small class="text-muted">请登录后使用</small>
            </div>
            {% if error %}
            <div class="alert alert-danger py-2 small">{{ error }}</div>
            {% endif %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">用户名</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" name="username" value="{{ username|default('') }}"
                               placeholder="请输入用户名" autofocus required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" name="password"
                               placeholder="请输入密码" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-box-arrow-in-right"></i> 登录
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
